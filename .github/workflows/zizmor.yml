name: zizmor

# Lints the workflow files on every change so a future edit can't quietly
# reintroduce an unpinned action, a persisted credential, or a template
# injection, the classes of mistake the release pipeline was hardened against.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          version: "1.26.1"
          # SARIF upload would need security-events: write; plain log output
          # keeps this job read-only.
          advanced-security: false
